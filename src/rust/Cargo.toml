[package]
name = 'rbm25'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = "1.65.0"

[lib]
crate-type = [ 'staticlib' ]
name = 'rbm25'

[dependencies]
bm25 = { version = "2.3.2", features = ["language_detection"]}
extendr-api = '0.9.0'
# transitive dep of bm25; pinned because 1.13+ raises MSRV above our rust-version above
unicode-segmentation = "=1.12.0"
